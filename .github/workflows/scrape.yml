name: Generate bookstore dataset and analysis

on:
  push:
    branches: [main]
    paths:
      - 'bookstore_scraper.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/scrape.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python bookstore_scraper.py --pages 5
      - name: Commit generated dataset and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitor_books.csv ceo_selected_books.csv analysis_report.md rating_distribution.png
          if ! git diff --cached --quiet; then
            git commit -m "Update scraped bookstore dataset and analysis [skip ci]"
            git push
          fi
